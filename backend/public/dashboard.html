<!DOCTYPE html>
<html>

<head>

    <title>Dashboard</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body onload="carregarUsuarios()">
    <div class="topbar">

    <button
        class="logout-btn"
        onclick="logout()"
    >
        Logout
    </button>

</div>

<h1>📊 Dashboard</h1>

<div class="crypto-card">

    <div>

        <div>
            Moeda do Sistema - Đ Dalmacoin
        </div>

        <div class="crypto-balance">
            Mercado hoje: 1 Đ = $ 1.000.000,00 
        </div>

    </div>

</div>

<div id="painelAdmin"></div>

<div class="box">

    <table>

        <thead>

            <tr>
                <th>Avatar</th>
                <th>ID</th>
                <th>Nome</th>
                <th>Descricao</th>
                <th>Saldo</th>
                <th>Tipo</th>
            </tr>

        </thead>

        <tbody id="listaUsuarios"></tbody>

    </table>

</div>

<script src="app.js"></script>

</body>

</html>
