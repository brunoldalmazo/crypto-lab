<!DOCTYPE html>
<html>

<head>

    <title>Painel Admin</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

<a href="dashboard.html">
    ← Voltar Dashboard
</a>

<h1>🛠️ Painel Admin</h1>

<div class="box">

    <h2>💸 Transferir Criptos</h2>

    <input
        id="fromId"
        placeholder="ID origem"
    >

    <input
        id="toId"
        placeholder="ID destino"
    >

    <input
        id="valor"
        placeholder="Valor"
    >

    <button onclick="transferirAdmin()">
        Transferir
    </button>

</div>

<div class="box">

    <h2>👑 Alterar Cargo</h2>

    <input
        id="userId"
        placeholder="ID usuario"
    >

    <select id="novoTipo">

        <option value="user">
            user
        </option>

        <option value="admin">
            admin
        </option>

    </select>

    <button onclick="alterarCargo()">
        Alterar Cargo
    </button>

</div>

<div class="box">

    <h2>🔑 Alterar Senha</h2>

    <input
        id="senhaUserId"
        placeholder="ID usuario"
    >

    <input
        id="novaSenhaAdmin"
        placeholder="Nova senha"
    >

    <button onclick="alterarSenha()">
        Alterar Senha
    </button>

</div>

    <div class="box">

    <h2>➕ Criar Usuario</h2>

    <input
        id="adminNovoNome"
        placeholder="Nome"
    >

    <input
        id="adminNovaSenha"
        placeholder="Senha"
    >

    <input
        id="adminDescricao"
        placeholder="Descricao"
    >

    <input
        id="adminSaldo"
        placeholder="Saldo inicial"
    >

    <select id="adminTipo">

        <option value="user">
            user
        </option>

        <option value="admin">
            admin
        </option>

    </select>

    <button onclick="adminCriarUsuario()">
        Criar Usuario
    </button>

</div>

<script src="app.js"></script>

</body>

</html>
