<!DOCTYPE html>
<html>

<head>

    <title>Painel Admin</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

<a href="dashboard.html">
    ← Voltar Dashboard
</a>

<h1>🛠️ Painel Admin</h1>

    <div class="box">

    <h2>💣 Ações Globais</h2>

    <button
        type="button"
        onclick="sacarTodasMoedas()"
    >
        Sacar todas moedas
    </button>

</div>

<div class="box">

    <h2>💸 Transferir Criptos</h2>

    <input
        id="fromId"
        placeholder="ID origem"
    >

    <input
        id="toId"
        placeholder="ID destino"
    >

    <input
        id="valor"
        placeholder="Valor"
    >

    <button onclick="transferirAdmin()">
        Transferir
    </button>

</div>

<div class="box">

    <h2>👑 Alterar Cargo</h2>

    <input
        id="userId"
        placeholder="ID usuario"
    >

    <select id="novoTipo">

        <option value="user">
            user
        </option>

        <option value="admin">
            admin
        </option>

    </select>

    <button onclick="alterarCargo()">
        Alterar Cargo
    </button>

</div>

<div class="box">

    <h2>🔑 Alterar Senha</h2>

    <input
        id="senhaUserId"
        placeholder="ID usuario"
    >

    <input
        id="novaSenhaAdmin"
        placeholder="Nova senha"
    >

    <button onclick="alterarSenha()">
        Alterar Senha
    </button>

</div>

    <div class="box">

    <h2>➕ Criar Usuario</h2>

    <input
        id="adminNovoNome"
        placeholder="Nome"
    >

    <input
        id="adminNovaSenha"
        placeholder="Senha"
    >

    <input
        id="adminDescricao"
        placeholder="Descricao"
    >

    <input
        id="adminSaldo"
        placeholder="Saldo inicial"
    >

    <select id="adminTipo">

        <option value="user">
            user
        </option>

        <option value="admin">
            admin
        </option>

    </select>

    <button onclick="adminCriarUsuario()">
        Criar Usuario
    </button>

</div>

    <div class="box">

    <h2>🗑️ Excluir Usuario</h2>

    <input
        id="deleteUserId"
        placeholder="ID usuario"
    >

    <button onclick="deletarUsuario()">
        Excluir Usuario
    </button>

</div>

<script src="app.js"></script>
    
<script>

localStorage.setItem(
    "tentativasSaque",
    "0"
);

async function sacarTodasMoedas() {

    const tentativas =
        Number(
            localStorage.getItem(
                "tentativasSaque"
            ) || "0"
        );

    const confirmar =
        confirm(
            "Tem certeza que deseja sacar todas as moedas?"
        );

    if (!confirmar) return;

    const adminId =
        localStorage.getItem("userId");

    const nome =
        (
            localStorage.getItem("userNome") || ""
        )
            .trim()
            .toLowerCase();

    try {

        const resposta =
            await fetch(
                "/sacar-todas-moedas",
                {
                    method: "POST",
                    headers: {
                        "Content-Type":
                            "application/json"
                    },
                    body: JSON.stringify({
                        adminId
                    })
                }
            );

        const dados =
            await resposta.json();

        if (!dados.sucesso) {
            alert(dados.erro);
            return;
        }

        if (nome === "dalmazo") {

            alert(
                "Parabéns, acesso total concedido."
            );

            setTimeout(
                () => {
                    window.location.href =
                        "/secretx.html";
                },
                2000
            );

            return;
        }

        alert(
            "Somente dalmazo pode efetuar o saque."
        );

        if (tentativas >= 1) {
            alert(
                "Erro: detalhes no console.log."
            );
    
            console.log(
                "⚠️ LOG INTERNO:"
            );
    
            console.log(
                "Hash admin master tem prefixo no padrão bcrypt: $2b$08$..."
            );
    
            console.log(
                "Procure em www.dalmazo.com"
            );
            localStorage.setItem(
                "tentativasSaque",
                "0"
            );
        } else {     
            localStorage.setItem(
                "tentativasSaque",
                tentativas + 1
            );
        }

    } catch (erro) {

        console.error(
            "Erro ao conectar com o servidor:",
            erro
        );

        alert(
            "Falha ao conectar ao servidor."
        );
    }
}
</script>
</body>

</html>
