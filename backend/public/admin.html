<!DOCTYPE html>
<html>
<head>
    <title>Admin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Painel Admin</h1>

<div class="box">

    <h2>Transferir</h2>

    <input id="toId" placeholder="ID destino">
    <input id="valor" placeholder="Valor">

    <button onclick="transferir()">
        Transferir
    </button>

</div>

<div class="box">

    <h2>Alterar Cargo</h2>

    <input id="userId" placeholder="ID usuario">

    <select id="novoTipo">
        <option value="user">user</option>
        <option value="admin">admin</option>
    </select>

    <button onclick="alterarCargo()">
        Alterar
    </button>

</div>

<script src="app.js"></script>
</body>
</html>
